[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "h2s-agent"
version = "1.1.0"
description = "Agent local H2S (brique 18) : collecte, buffer hors réseau, exécution des ordres signés, apprentissage fédéré borné"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=43",
]

[project.optional-dependencies]
test = ["pytest>=8", "amqtt>=0.11", "pytest-cov>=5,<8", "ruff>=0.9,<0.17"]
# Magasin de clés TPM 2.0 (key_store "tpm2") : bibliothèques tpm2-tss du système requises (libtss2-dev).
tpm = ["tpm2-pytss>=3.0,<4"]

[tool.setuptools]
packages = ["h2s_agent", "h2s_boot"]

[tool.setuptools.package-data]
h2s_agent = ["migrations/*.sql", "MANIFEST.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Plancher Python : 3.10 (requires-python) — les boîtiers Debian les plus anciens.
target-version = "py310"
line-length = 120

[tool.coverage.run]
source = ["h2s_agent", "h2s_boot"]
branch = true

[tool.coverage.report]
show_missing = true
# Mesuré 78 % au 26/09 avec base PostgreSQL — seuil 70 : bloque une chute nette,
# tolère les modules matériels peu couvrables (tpm, __main__, h2s_boot).
fail_under = 70
