version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: h2s_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-h2s_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-h2s_pass}
      POSTGRES_DB: ${POSTGRES_DB:-h2s_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  collector:
    build: .
    container_name: h2s_collector
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  pgdata:
