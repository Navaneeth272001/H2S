# Broker MQTT local du site (brique 18) — exemple, non vérifié sur boîtier réel.
# Écoute sur le réseau Wi-Fi des équipements seulement, jamais sur l'interface WAN/VPN.
per_listener_settings true

listener 8883 192.168.50.1
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
tls_version tlsv1.2
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Agent sur la même machine : boucle locale, toujours authentifié.
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
